<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Ingest</title>
<style>
:root{
  --ink:#15201C; --paper:#F3F1EA; --muted:#8A8A82; --border:#D8D5CC;
  --accent:#0C5A6E; --accent-ink:#FFFFFF;
  --warn-bg:#FFF3C4; --warn-ink:#6B5200; --warn-border:#C9A52B;
  --claude-bg:#EEEDFE; --claude-ink:#3C3489; --claude-border:#8B82E8;
  --ok-bg:#EDF4EE; --ok-ink:#2A6030;
  --synced-c:#2A6030; --syncing-c:#7A6000; --offline-c:#9B2020;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:15px; line-height:1.4; padding-bottom:80px;}
header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; justify-content:space-between;}
h1{font-size:17px; margin:0;}
.sync-badge{font-size:11px; display:flex; align-items:center; gap:5px; color:var(--muted);}
.sync-dot{width:8px; height:8px; border-radius:50%; background:var(--muted);}
.sync-dot[data-state="synced"]{background:var(--synced-c);}
.sync-dot[data-state="syncing"]{background:var(--syncing-c);}
.sync-dot[data-state="offline"]{background:var(--offline-c);}
main{padding:14px; max-width:720px; margin:0 auto;}
.card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px;}
.card h2{font-size:14px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
.file-row{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
.file-row label{font-size:13px; color:var(--muted);}
input[type=file]{font-size:14px;}
button{font-family:inherit; font-size:14px; border-radius:7px; border:1px solid var(--border); background:#fff; padding:9px 14px; cursor:pointer;}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
button.primary:disabled{opacity:.45; cursor:default;}
button.ghost{background:transparent; border-color:transparent; color:var(--accent); padding:4px 8px;}
.txn{border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; background:#fff;}
.txn.needs-review{border-color:var(--warn-border); background:var(--warn-bg);}
.txn.needs-claude{border-color:var(--claude-border); background:var(--claude-bg);}
.txn.ok{background:var(--ok-bg); border-color:#8BBD93;}
.txn-desc{font-size:13px; font-weight:600;}
.txn-meta{font-size:12px; color:var(--muted); margin-top:2px;}
.txn-controls{display:flex; gap:6px; margin-top:8px; align-items:center; flex-wrap:wrap;}
select, .freetext{font-size:14px; padding:6px 8px; border-radius:6px; border:1px solid var(--border); flex:1; min-width:140px;}
.tag{font-size:10px; font-family:'Courier New',monospace; padding:2px 6px; border-radius:4px; display:inline-block;}
.tag.warn{background:var(--warn-border); color:#fff;}
.tag.claude{background:var(--claude-border); color:#fff;}
.tag.ok{background:#8BBD93; color:#fff;}
.section-count{font-size:12px; color:var(--muted); font-weight:normal;}
.bal-row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid var(--border);}
.bal-row:last-child{border-bottom:none;}
.empty{color:var(--muted); font-size:13px; font-style:italic;}
.footer-bar{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border); padding:10px 14px; display:flex; gap:8px; z-index:30;}
.footer-bar button{flex:1;}
.pill{display:inline-block; font-size:11px; padding:3px 8px; border-radius:20px; background:var(--border); margin-right:4px;}
.update-banner{position:fixed; left:12px; right:12px; bottom:70px; z-index:500; background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-border); border-radius:10px; padding:12px 16px; font-size:14px; font-weight:600; text-align:center; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.15);}
#staleBlock{position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px;}
.stale-block-card{background:#fff; border-radius:10px; padding:20px; max-width:360px; text-align:center;}
</style>
</head>
<body>
<header>
  <h1>Budget Ingest</h1>
  <div class="sync-badge"><span class="sync-dot" id="syncBadge" data-state="offline"></span><span id="syncLabel">offline</span></div>
</header>
<main id="main"></main>

<div class="footer-bar" id="footerBar" style="display:none;">
  <button id="btnReset">Start over</button>
  <button class="primary" id="btnReady">Mark ready for Claude</button>
</div>

<script>
// ============================================================================
// DATA MODEL
// STATE.pull is the one in-progress ingestion session. There is only ever
// one "current" pull at a time - matches how Chris actually works (export
// one bank CSV, finish categorizing it, hand off to Claude, repeat).
// pull.status: 'staging' (Chris is still reviewing) -> 'ready' (saved,
// waiting for a Claude Code session to read it and build the next handoff)
// -> cleared by "Start over" once Claude has consumed it.
//
// SCOPE NOTE (v1, 2026-11-16): this app does categorization, not dedup.
// Cross-pull duplicate detection (the same transaction appearing in two
// overlapping bank exports) stays with the existing Claude-side reconcile
// scripts (dedupAndCategorize() in handoff_v26_build_writeplan.js and its
// predecessors), which already do this correctly against the live T1 table.
// This app only flags/removes exact duplicate ROWS within one upload.
//
// VERSION HISTORY
// v1 (2026-11-16): one combined-CSV upload per pull (Chris's bank export
//   bundled all 7 accounts into one file with an account column).
// v2 (2026-11-16, same day): Chris's banks switched to raw, per-institution
//   portal exports (one file per account - BoA/Delta/Ameris, each its own
//   CSV shape) - see _budget_ingest_analysis/AUTOMATION_ROADMAP.md "Raw
//   multi-bank-portal ingestion". Replaced the single bankFile upload with
//   a repeatable per-account "Add a bank file" flow (mergeAccountData(),
//   replace-by-account so re-adding a account never double-counts).
//   STATE.pull gained `filesAdded` (what's been added this pull, for
//   display) and each `balances` entry gained `source` ('file' |
//   'manual-confirmed' | 'carry-forward') - ported straight from the
//   Node-side parse_raw_bank_exports.js's `balanceNeedsConfirmation`
//   contract (a BoA file with pending transactions, or any Ameris file
//   which never has a balance column, requires Chris to type the real
//   balance instead of auto-trusting the file).
// ============================================================================
var SCHEMA_VERSION = 2;
var STATE = { pull: null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2) + '-' + Date.now(); }

// ---------------- CSV / date helpers (ported from the Excel reconciliation pipeline) ----------------
function parseCSVRows(text){
  var rows=[], row=[], field='', inQuotes=false;
  text = text.replace(/^﻿/, '');
  for (var i=0;i<text.length;i++){
    var c=text[i], n=text[i+1];
    if (inQuotes){ if(c==='"'&&n==='"'){field+='"';i++;} else if(c==='"'){inQuotes=false;} else field+=c; }
    else { if(c==='"') inQuotes=true; else if(c===',') {row.push(field);field='';} else if(c==='\r'){} else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';} else field+=c; }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
var EXCEL_EPOCH_MS = Date.UTC(1899,11,30);
function toSerial(dateStr){
  var m = String(dateStr).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return null;
  var mo=+m[1], da=+m[2], yr=m[3].length===2?('20'+m[3]):m[3];
  return Math.round((Date.UTC(+yr, mo-1, da) - EXCEL_EPOCH_MS) / 86400000);
}
function isoFromSerial(serial){ return new Date(EXCEL_EPOCH_MS + serial*86400000).toISOString().slice(0,10); }
// Known limitation (same as the rest of this pipeline): week boundaries are
// hardcoded per calendar month. Add the new month's bounds here when this
// app is used past November 2026.
var WK_BOUNDS = [
  ['Wk1', toSerial('11/1/26'), toSerial('11/8/26')],
  ['Wk2', toSerial('11/9/26'), toSerial('11/15/26')],
  ['Wk3', toSerial('11/16/26'), toSerial('11/22/26')],
  ['Wk4', toSerial('11/23/26'), toSerial('11/30/26')],
];
function weekOf(serial){ for (var i=0;i<WK_BOUNDS.length;i++){ if(serial>=WK_BOUNDS[i][1] && serial<=WK_BOUNDS[i][2]) return WK_BOUNDS[i][0]; } return 'Wk5'; }
function isValidDateStr(s){ return toSerial(s)!==null; }
function parseMoney(s){
  if (s===undefined||s===null||s==='') return NaN;
  var cleaned = String(s).replace(/[$,()]/g,'').replace(/^\s+|\s+$/g,'');
  var negParen = /\(/.test(String(s));
  var n = parseFloat(cleaned);
  if (isNaN(n)) return NaN;
  return negParen ? -Math.abs(n) : n;
}

// ---------------- raw bank-portal parsers (ported 2026-11-16 from the
// Claude-side parse_raw_bank_exports.js, validated there against all six of
// Chris's real files before this port - see AUTOMATION_ROADMAP.md "Raw
// multi-bank-portal ingestion"). One file per account now, not one combined
// CSV - this replaces the old parseBankCSV() entirely; the old combined
// "stmt (N).csv" format is no longer produced by Chris's bank portals. ----
function parseBoAFile(text, account){
  var rows = parseCSVRows(text);
  var balance = null;
  for (var i=0;i<rows.length;i++){ if (/^Ending balance as of/i.test(String(rows[i][0]||''))){ balance = parseFloat(String(rows[i][2]).replace(/,/g,'')); break; } }
  var hdr=-1; for (var h=0;h<rows.length;h++){ if (rows[h][0]==='Date' && rows[h][1]==='Description'){ hdr=h; break; } }
  var transactions=[], pendingSkipped=[];
  for (var r=hdr+1; r<rows.length; r++){
    var row=rows[r]; var dateField=String(row[0]||'').trim();
    if (!dateField) continue;
    if (!isValidDateStr(dateField)){
      if (dateField==='Processing' || dateField==='Authorized') pendingSkipped.push({description:row[1], amount:row[3]});
      continue;
    }
    var desc=row[1];
    if (/^Beginning balance as of/i.test(String(desc||''))) continue;
    var amt = parseFloat(String(row[2]).replace(/,/g,''));
    if (isNaN(amt) || amt===0) continue;
    transactions.push({ id: uid('t'), dateStr: dateField, serial: toSerial(dateField), description: desc, amount: Math.abs(amt), isDebit: amt<0, account: account });
  }
  if (balance===null) throw new Error('No "Ending balance as of" line found in this BoA file.');
  // balanceNeedsConfirmation: BoA's "Ending balance" line does not net out
  // pending holds the same way BoA's own app balance does (confirmed
  // 2026-11-16: a file said $3,267.82 while Chris's actual confirmed
  // balance that same pull was $1,867.56) - never auto-apply `balance` when
  // this is true, ask Chris for the real figure instead.
  return { transactions: transactions, balance: balance, pendingSkipped: pendingSkipped, balanceNeedsConfirmation: pendingSkipped.length>0 };
}
function parseDeltaFile(text, account){
  var rows = parseCSVRows(text);
  var hdr=-1; for (var h=0;h<rows.length;h++){ if (rows[h][0]==='Transaction Number' && rows[h][1]==='Date'){ hdr=h; break; } }
  if (hdr===-1) throw new Error('Delta header row ("Transaction Number,Date,...") not found in this file.');
  var transactions=[], balance=null, balanceSerial=-1;
  for (var r=hdr+1; r<rows.length; r++){
    var row=rows[r]; var dateField=String(row[1]||'').trim();
    if (!dateField || !isValidDateStr(dateField)) continue;
    var desc = row[3] || row[2]; // Memo (real detail) preferred over the generic Description column
    var debit = parseFloat(String(row[4]).replace(/,/g,''));
    var credit = parseFloat(String(row[5]).replace(/,/g,''));
    var amt = !isNaN(debit) ? -Math.abs(debit) : (!isNaN(credit) ? Math.abs(credit) : NaN);
    var bal = parseFloat(String(row[6]).replace(/,/g,''));
    var serial = toSerial(dateField);
    if (!isNaN(bal) && serial!==null && serial>balanceSerial){ balance=bal; balanceSerial=serial; }
    if (isNaN(amt) || amt===0) continue;
    transactions.push({ id: uid('t'), dateStr: dateField, serial: serial, description: desc, amount: Math.abs(amt), isDebit: amt<0, account: account });
  }
  if (balance===null) throw new Error('No balance column found in this Delta file.');
  return { transactions: transactions, balance: balance };
}
function parseAmerisFile(text, account){
  var rows = parseCSVRows(text);
  var hdr=-1; for (var h=0;h<rows.length;h++){ if (rows[h][0]==='Date' && rows[h][2]==='Transaction Type'){ hdr=h; break; } }
  if (hdr===-1) throw new Error('Ameris header row ("Date,Check#,Transaction Type,...") not found in this file.');
  var transactions=[];
  for (var r=hdr+1; r<rows.length; r++){
    var row=rows[r]; var dateField=String(row[0]||'').trim();
    if (!dateField || !isValidDateStr(dateField)) continue;
    var desc=row[3];
    var debit=parseMoney(row[4]), credit=parseMoney(row[5]);
    var amt = (!isNaN(debit) && debit!==0) ? -Math.abs(debit) : ((!isNaN(credit) && credit!==0) ? Math.abs(credit) : NaN);
    if (isNaN(amt)) continue;
    transactions.push({ id: uid('t'), dateStr: dateField, serial: toSerial(dateField), description: desc, amount: Math.abs(amt), isDebit: amt<0, account: account });
  }
  // Ameris exports never carry a balance column at all. The Node-side
  // convention (a Claude session prepends "BALANCE,<amount>" read off a
  // screenshot) exists to support headless re-runs with no live UI - this
  // app always has a live UI, so Chris just types the balance directly
  // (see the manual-balance input wired in wireAddFile()) instead.
  return { transactions: transactions, balance: null };
}
var ACCOUNTS = [
  { value:'boa joint',          label:'BoA Joint',                type:'boa' },
  { value:'boa hamly',          label:'BoA Hamly',                 type:'boa' },
  { value:'delta pay from',     label:'Delta Pay From (Checking)', type:'delta' },
  { value:'delta savings',      label:'Delta Savings',             type:'delta' },
  { value:'delta money market', label:'Delta Money Market',        type:'delta' },
  { value:'ameris macs tax',    label:'Ameris Macs Tax',           type:'ameris' },
  { value:'ameris macs rox',    label:'Ameris Macs Rox',           type:'ameris' },
];
function accountInfo(value){ return ACCOUNTS.find(function(a){ return a.value===value; }); }

// ---------------- auto-detection (added 2026-11-16, Chris: "having to make
// note of which account slows down the process") ----------------
// sniffFileType: content-based, reliable for all three institutions - each
// has a distinct, exact header row this pipeline already searches for.
// Delta's own "Account Name : <value>" header line has no comma before the
// colon, so it lands whole in field 0 (e.g. "Account Name : Savings", or
// "Account Name : Free Checking ****959" with trailing empty fields after
// it on some pulls) - never split into separate label/value columns.
function deltaAccountNameLine(rows){
  for (var i=0;i<Math.min(rows.length,5);i++){
    var f0 = String(rows[i][0]||'').trim();
    if (/^account name\s*:/i.test(f0)) return f0;
  }
  return null;
}
function sniffFileType(text){
  var rows = parseCSVRows(text);
  if (deltaAccountNameLine(rows)) return 'delta';
  for (var r=0;r<rows.length;r++){
    if (rows[r][0]==='Date' && rows[r][1]==='Description') return 'boa';
    if (rows[r][0]==='Date' && rows[r][2]==='Transaction Type') return 'ameris';
    if (String(rows[r][0]||'').trim().toUpperCase()==='BALANCE') return 'ameris'; // the prepended-balance convention
  }
  return null;
}
// resolveDeltaAccount: every Delta export states its own account name in
// the header ("Account Name : Savings" / "... Money Market ****514" /
// "... Free Checking ****959") - no ambiguity, no need to ask.
function resolveDeltaAccount(text){
  var line = deltaAccountNameLine(parseCSVRows(text));
  if (!line) return null;
  var nameLine = line.toLowerCase();
  if (nameLine.indexOf('savings')!==-1) return 'delta savings';
  if (nameLine.indexOf('money market')!==-1) return 'delta money market';
  if (nameLine.indexOf('checking')!==-1) return 'delta pay from';
  return null;
}
// resolveAmerisAccount: Ameris's own export filename embeds the account's
// last 4 digits ("Transactions_5385_...csv" = MACS TAX ****5385). Extend
// AMERIS_LAST4 if a new Ameris account starts producing files.
var AMERIS_LAST4 = { '5385':'ameris macs tax', '4036':'ameris macs rox' };
function resolveAmerisAccount(filename){
  var m = String(filename||'').match(/Transactions_(\d+)_/i);
  if (!m) return null;
  return AMERIS_LAST4[m[1]] || null;
}

// ---------------- categorization (ported from normalize_lib.js + dedupAndCategorize()) ----------------
var AMBIGUOUS_STOREFRONTS = ['WM SUPERCENTER','WAL-MART','WALMART','SAMS CLUB',"SAM'S CLUB",'TARGET','COSTCO'];
var DISAMBIGUATING_KEYWORDS = ['FUEL','GAS','PHARMACY','NEIGHBORHOOD MARKET','LIQUOR'];
function normalizeDesc(desc){
  if (!desc) return { key:'', ambiguous:false };
  var original = String(desc).toUpperCase();
  var s = original;
  var indnName = '';
  var indnMatch = s.match(/INDN:\s*([A-Z]+(?:\s+[A-Z]+)?)/);
  if (indnMatch) indnName = indnMatch[1].trim();
  s = s.replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g, ' ');
  s = s.replace(/#?\d{4,}/g, ' ');
  try {
    s = s.replace(/(?<!CO )\bID:\s*[A-Z0-9-]*\d[A-Z0-9-]*\b/g, ' ');
    s = s.replace(/(?<=PMTS )ID:\s*[A-Z0-9-]+\b/g, ' ');
  } catch(e) { /* lookbehind unsupported - degrades gracefully, more rows land in needs-review */ }
  s = s.replace(/\b(PURCHASE|WITHDRWL|DES|ID|CO|WEB|INDN|XXXXX\w*)\b/g, ' ');
  s = s.replace(/[^A-Z0-9 *.'-]/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  var key = s.split(' ').slice(0,4).join(' ');
  var isAmbiguousStorefront = AMBIGUOUS_STOREFRONTS.some(function(name){ return key.indexOf(name)!==-1 || original.indexOf(name)!==-1; });
  var foundKeyword = DISAMBIGUATING_KEYWORDS.find(function(kw){ return original.indexOf(kw)!==-1; });
  if (indnName) key = key + ' INDN:' + indnName;
  if (foundKeyword) key = key + ' [' + foundKeyword + ']';
  return { key:key, ambiguous: isAmbiguousStorefront && !foundKeyword };
}
function categorize(desc, serial, refByKey){
  var wk = weekOf(serial), wkNum = wk.replace('Wk','');
  if (/\b(AMAZON|AMZN)\b/i.test(desc)) return { sub:'random_amazon', main:'RANDOM', logistics:'OTHER', priority:'02_PRIORITY', schedule:'02_PRIORITY', confidence:'high' };
  if (/\bKROGER\b/i.test(desc) && /\bFUEL\b/i.test(desc)) return { sub:'auto_gas_wk'+wkNum, main:'AUTO', logistics:'LIVING EXPENSES', priority:'01_PRIORITY_WEEKLY', schedule:'03_WKLY', confidence:'high' };
  if (/\bKROGER\b/i.test(desc) || /MCDONALD'?S\b/i.test(desc) || /CHICK.?FIL.?A/i.test(desc) || /\bWAL.?MART\b/i.test(desc) || /\bWM SUPERCENTER\b/i.test(desc)) return { sub:'food_groceries_wk'+wkNum, main:'FOOD', logistics:'LIVING EXPENSES', priority:'01_PRIORITY_WEEKLY', schedule:'03_WKLY', confidence:'high' };
  var key = normalizeDesc(desc).key;
  var match = refByKey.get(key);
  if (match && match.category_main === '??') return { sub:'low-confidence', main:'XXCON', logistics:'', priority:'', schedule:'', confidence:'needs-review' };
  if (match) {
    var sub = match.category_sub;
    if (match.priority === '01_PRIORITY_WEEKLY' && /_wk\d+$/i.test(sub)) sub = sub.replace(/_wk\d+$/i,'') + '_wk' + wkNum;
    return { sub:sub, main:match.category_main, logistics:match.category_logistics, priority:match.priority, schedule:match.schedule, confidence: match.confidence || 'high' };
  }
  return { sub:'low-confidence', main:'XXCON', logistics:'', priority:'', schedule:'', confidence:'needs-review' };
}
function parseReferenceCSV(text){
  var rows = parseCSVRows(text);
  var headers = rows[0];
  var refByKey = new Map(), subSet = new Set();
  for (var i=1;i<rows.length;i++){
    var r = rows[i]; if (!r[0] && r.length<2) continue;
    var o = {}; for (var j=0;j<headers.length;j++) o[headers[j]] = r[j]!==undefined?r[j]:'';
    refByKey.set(o.key, o);
    if (o.category_sub) subSet.add(o.category_sub.replace(/_wk\d+$/i,''));
  }
  return { refByKey: refByKey, subs: Array.from(subSet).sort() };
}

// ---------------- app state / render ----------------
var REF = { refByKey: new Map(), subs: [] };

function ensurePull(){
  if (!STATE.pull) STATE.pull = { pullDate: new Date().toISOString().slice(0,10), status:'staging', transactions: [], balances: [] };
  return STATE.pull;
}
// Merges one account's freshly-parsed file (or manually-entered balance) into
// the current pull. Replace-by-account, not append-only: re-adding an
// account (Chris picked the wrong file, or wants to redo one) drops that
// account's previously-added transactions first, so nothing doubles up.
// Cross-pull dedup against the live Excel T1 table still stays with the
// Claude-side reconcile scripts (see the SCOPE NOTE above) - this is only
// about not duplicating rows within this app's own current pull.
function mergeAccountData(account, rawTxns, balanceEntry){
  var p = ensurePull();
  p.transactions = p.transactions.filter(function(t){ return t.account !== account; });
  var cat_txns = rawTxns.map(function(t){
    var cat = categorize(t.description, t.serial, REF.refByKey);
    return Object.assign({}, t, cat, { resolved: cat.confidence === 'high', flaggedForClaude:false, claudeNote:'' });
  });
  p.transactions = p.transactions.concat(cat_txns);
  p.balances = p.balances.filter(function(b){ return b.account !== account; });
  if (balanceEntry) p.balances.push(balanceEntry);
  p.filesAdded = p.filesAdded || [];
  p.filesAdded = p.filesAdded.filter(function(f){ return f.account !== account; });
  p.filesAdded.push({ account: account, txnCount: cat_txns.length, balance: balanceEntry ? balanceEntry.balance : null, source: balanceEntry ? balanceEntry.source : 'none', addedAt: new Date().toISOString() });
  saveLocal(); render(); if (typeof FB!=='undefined') FB.scheduleWrite();
}

function render(){
  var main = document.getElementById('main');
  var footer = document.getElementById('footerBar');
  var html = renderAddFileCard();
  if (!STATE.pull || !STATE.pull.transactions.length && !STATE.pull.balances.length){
    main.innerHTML = html;
    wireAddFile();
    footer.style.display = 'none';
    return;
  }
  var p = STATE.pull;
  var needsReview = p.transactions.filter(function(t){ return !t.resolved && !t.flaggedForClaude; });
  var needsClaude = p.transactions.filter(function(t){ return t.flaggedForClaude; });
  var ok = p.transactions.filter(function(t){ return t.resolved && !t.flaggedForClaude; });

  html += '<div class="card"><h2>Account balances as of ' + esc(p.pullDate) + '</h2>';
  html += p.balances.length ? p.balances.map(function(b){ return '<div class="bal-row"><span>'+esc(b.account)+(b.source==='manual-confirmed'?' <span class="pill">you confirmed</span>':b.source==='carry-forward'?' <span class="pill">carried forward</span>':'')+'</span><span>$'+b.balance.toFixed(2)+'</span></div>'; }).join('') : '<div class="empty">No accounts added yet.</div>';
  html += '</div>';

  html += '<div class="card"><h2>Needs your review <span class="section-count">(' + needsReview.length + ')</span></h2>';
  html += needsReview.length ? needsReview.map(renderReviewTxn).join('') : '<div class="empty">Nothing left to review.</div>';
  html += '</div>';

  html += '<div class="card"><h2>Flagged for Claude <span class="section-count">(' + needsClaude.length + ')</span></h2>';
  html += needsClaude.length ? needsClaude.map(renderClaudeTxn).join('') : '<div class="empty">Nothing flagged.</div>';
  html += '</div>';

  html += '<div class="card"><h2>Auto-categorized <span class="section-count">(' + ok.length + ')</span></h2>';
  html += ok.length ? ok.map(renderOkTxn).join('') : '<div class="empty">None yet.</div>';
  html += '</div>';

  main.innerHTML = html;
  footer.style.display = 'flex';
  document.getElementById('btnReady').disabled = (needsReview.length > 0);
  wireAddFile();
  wireReview();
}
function renderAddFileCard(){
  var p = STATE.pull;
  var added = (p && p.filesAdded) ? p.filesAdded : [];
  var acctOpts = ACCOUNTS.map(function(a){ return '<option value="'+a.value+'">'+esc(a.label)+'</option>'; }).join('');
  var html = '<div class="card"><h2>Add a bank file</h2>';
  html += '<div class="file-row"><label>Reference file - archive_reference_full.csv (optional, upload once - skip and everything lands in "needs your review")</label><input type="file" id="fileRef" accept=".csv"></div>';

  // Account is auto-detected from the file itself (added 2026-11-16, Chris:
  // "having to make note of which account slows down the process") - Delta
  // and Ameris are fully automatic, BoA only needs one Joint/Hamly tap since
  // its own exports carry no account-identifying text at all.
  html += '<div class="file-row"><label>Raw export file (.csv) - any BoA, Delta or Ameris export, no need to say which account</label><input type="file" id="addFile" accept=".csv,.CSV"></div>';
  html += '<div id="detectStatus" style="display:none; font-size:13px; color:var(--muted); margin-bottom:8px;"></div>';
  html += '<div class="file-row" id="boaChoiceRow" style="display:none;"><label>Which BoA account is this?</label><div class="txn-controls"><button type="button" id="boaJointBtn">Joint</button><button type="button" id="boaHamlyBtn">Hamly</button></div></div>';
  html += '<div id="manualOverrideToggleWrap" style="display:none;"><button type="button" class="ghost" id="manualOverrideToggle">Not right? Choose account manually</button></div>';
  html += '<div class="file-row" id="manualOverrideRow" style="display:none;"><label>Account</label><select id="addAccount"><option value="">- choose account -</option>' + acctOpts + '</select></div>';
  html += '<div class="file-row" id="addBalanceRow" style="display:none;"><label id="addBalanceLabel">Current balance</label><input type="number" step="0.01" class="freetext" id="addBalanceInput" placeholder="e.g. 156.36"></div>';
  html += '<div id="addFileError" style="display:none; color:#9B2020; font-size:13px; margin-bottom:8px;"></div>';
  html += '<button class="primary" id="btnAddFile" disabled>Add this account</button>';

  html += '<div style="margin:16px 0; border-top:1px solid var(--border);"></div>';
  html += '<div class="file-row"><label><input type="checkbox" id="addNoFile"> No new file this round for an account - just set/confirm its balance</label></div>';
  html += '<div class="file-row" id="noFileAccountRow" style="display:none;"><label>Account</label><select id="noFileAccount"><option value="">- choose account -</option>' + acctOpts + '</select></div>';
  html += '<div class="file-row" id="noFileBalanceRow" style="display:none;"><label>Balance to carry forward</label><input type="number" step="0.01" class="freetext" id="noFileBalanceInput" placeholder="e.g. 1.00"></div>';
  html += '<button id="btnNoFileAdd" style="display:none;">Set balance</button>';

  if (added.length){
    html += '<div style="margin-top:12px;">' + added.map(function(f){
      var info = accountInfo(f.account);
      return '<div class="bal-row"><span>' + esc(info?info.label:f.account) + ' &middot; ' + f.txnCount + ' txns</span><span>' + (f.balance!=null ? '$'+f.balance.toFixed(2) : '-') + '</span></div>';
    }).join('') + '</div>';
  }
  html += '</div>';
  return html;
}
function money(t){ return (t.isDebit?'-':'+') + '$' + t.amount.toFixed(2); }
function renderReviewTxn(t){
  var opts = REF.subs.map(function(s){ return '<option value="'+esc(s)+'"'+(t.sub===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
  return '<div class="txn needs-review" data-id="'+t.id+'">' +
    '<div class="txn-desc">'+esc(t.description)+'</div>' +
    '<div class="txn-meta">'+esc(t.dateStr)+' &middot; '+money(t)+' &middot; '+esc(t.account)+'</div>' +
    '<div class="txn-controls">' +
      '<select class="cat-select" data-id="'+t.id+'"><option value="">- pick a category -</option>'+opts+'</select>' +
      '<input class="freetext new-sub" data-id="'+t.id+'" placeholder="or type a new sub name">' +
    '</div>' +
    '<div class="txn-controls"><button class="ghost flag-claude" data-id="'+t.id+'">Flag for Claude instead</button></div>' +
  '</div>';
}
function renderClaudeTxn(t){
  return '<div class="txn needs-claude" data-id="'+t.id+'">' +
    '<div class="txn-desc">'+esc(t.description)+' <span class="tag claude">needs claude</span></div>' +
    '<div class="txn-meta">'+esc(t.dateStr)+' &middot; '+money(t)+' &middot; '+esc(t.account)+'</div>' +
    '<div class="txn-controls"><button class="ghost unflag-claude" data-id="'+t.id+'">Undo flag</button></div>' +
  '</div>';
}
function renderOkTxn(t){
  return '<div class="txn ok" data-id="'+t.id+'">' +
    '<div class="txn-desc">'+esc(t.description)+' <span class="tag ok">'+esc(t.sub)+'</span></div>' +
    '<div class="txn-meta">'+esc(t.dateStr)+' &middot; '+money(t)+' &middot; '+esc(t.account)+'</div>' +
  '</div>';
}
function findTxn(id){ return STATE.pull.transactions.find(function(t){ return t.id===id; }); }
function wireReview(){
  document.querySelectorAll('.cat-select').forEach(function(sel){
    sel.addEventListener('change', function(){
      var t = findTxn(sel.dataset.id); if (!t || !sel.value) return;
      t.sub = sel.value; t.resolved = true;
      saveLocal(); render(); if (typeof FB!=='undefined') FB.scheduleWrite();
    });
  });
  document.querySelectorAll('.new-sub').forEach(function(inp){
    inp.addEventListener('change', function(){
      var t = findTxn(inp.dataset.id); if (!t || !inp.value.trim()) return;
      t.sub = inp.value.trim();
      // A brand-new sub name usually means a new catalog row is needed too -
      // that's a decision for Claude/Chris together, not something this app
      // can safely finish on its own.
      t.flaggedForClaude = true;
      t.claudeNote = 'New sub proposed: ' + t.sub + ' - needs a catalog entry';
      saveLocal(); render(); if (typeof FB!=='undefined') FB.scheduleWrite();
    });
  });
  document.querySelectorAll('.flag-claude').forEach(function(btn){
    btn.addEventListener('click', function(){
      var t = findTxn(btn.dataset.id); if (!t) return;
      t.flaggedForClaude = true; t.claudeNote = t.claudeNote || 'Chris flagged this for review';
      saveLocal(); render(); if (typeof FB!=='undefined') FB.scheduleWrite();
    });
  });
  document.querySelectorAll('.unflag-claude').forEach(function(btn){
    btn.addEventListener('click', function(){
      var t = findTxn(btn.dataset.id); if (!t) return;
      t.flaggedForClaude = false; t.claudeNote = '';
      saveLocal(); render(); if (typeof FB!=='undefined') FB.scheduleWrite();
    });
  });
}
function wireAddFile(){
  var fileRefInput = document.getElementById('fileRef');
  if (fileRefInput) fileRefInput.addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){ REF = parseReferenceCSV(r.result); };
    r.readAsText(f);
  });

  var fileInput = document.getElementById('addFile');
  if (!fileInput) return; // add-file card not on screen

  var detectStatus = document.getElementById('detectStatus');
  var boaChoiceRow = document.getElementById('boaChoiceRow');
  var boaJointBtn = document.getElementById('boaJointBtn');
  var boaHamlyBtn = document.getElementById('boaHamlyBtn');
  var manualOverrideRow = document.getElementById('manualOverrideRow');
  var manualOverrideToggleWrap = document.getElementById('manualOverrideToggleWrap');
  var manualOverrideToggle = document.getElementById('manualOverrideToggle');
  var selAccount = document.getElementById('addAccount');
  var balRow = document.getElementById('addBalanceRow');
  var balLabel = document.getElementById('addBalanceLabel');
  var balInput = document.getElementById('addBalanceInput');
  var btnAdd = document.getElementById('btnAddFile');
  var errBox = document.getElementById('addFileError');

  var currentText = null;     // the selected file's text, read once
  var resolvedAccount = null; // the account we'll actually use on Add
  var pendingParsed = null;   // set when a manual balance confirmation is still needed

  function showError(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }
  function clearError(){ errBox.style.display = 'none'; errBox.textContent = ''; }
  function showDetect(msg){ detectStatus.textContent = msg; detectStatus.style.display = 'block'; }
  function setResolved(account){
    resolvedAccount = account;
    selAccount.value = account || '';
    btnAdd.disabled = !account;
  }
  function resetDetection(){
    pendingParsed = null; clearError();
    detectStatus.style.display = 'none';
    boaChoiceRow.style.display = 'none';
    manualOverrideRow.style.display = 'none';
    manualOverrideToggleWrap.style.display = 'none';
    balRow.style.display = 'none';
    setResolved(null);
  }

  fileInput.addEventListener('change', function(){
    resetDetection();
    var f = fileInput.files[0];
    if (!f) return;
    var filename = f.name;
    var reader = new FileReader();
    reader.onload = function(){
      currentText = reader.result;
      var type = sniffFileType(currentText);
      if (!type){
        showDetect('Could not tell which bank this is from the file - choose the account below.');
        manualOverrideRow.style.display = 'block';
        return;
      }
      if (type === 'delta'){
        var deltaAcct = resolveDeltaAccount(currentText);
        if (deltaAcct){ showDetect('Detected: ' + accountInfo(deltaAcct).label); manualOverrideToggleWrap.style.display = 'block'; setResolved(deltaAcct); }
        else { showDetect('Detected a Delta file, but not which account - choose it below.'); manualOverrideRow.style.display = 'block'; }
      } else if (type === 'ameris'){
        var amerisAcct = resolveAmerisAccount(filename);
        if (amerisAcct){ showDetect('Detected: ' + accountInfo(amerisAcct).label); manualOverrideToggleWrap.style.display = 'block'; setResolved(amerisAcct); }
        else { showDetect('Detected an Ameris file, but not which account from the filename - choose it below.'); manualOverrideRow.style.display = 'block'; }
      } else { // boa - no identifying signal in the file at all, has to ask
        showDetect('Detected a BoA file - which account?');
        boaChoiceRow.style.display = 'block';
      }
    };
    reader.readAsText(f);
  });

  boaJointBtn.addEventListener('click', function(){ setResolved('boa joint'); manualOverrideToggleWrap.style.display = 'block'; });
  boaHamlyBtn.addEventListener('click', function(){ setResolved('boa hamly'); manualOverrideToggleWrap.style.display = 'block'; });
  manualOverrideToggle.addEventListener('click', function(){
    manualOverrideRow.style.display = (manualOverrideRow.style.display === 'block') ? 'none' : 'block';
  });
  selAccount.addEventListener('change', function(){ if (selAccount.value) setResolved(selAccount.value); });
  balInput.addEventListener('input', clearError);

  btnAdd.addEventListener('click', function(){
    var info = accountInfo(resolvedAccount);
    if (!info || !currentText) return;
    clearError();

    function finish(parsed){
      if (info.type === 'ameris' || parsed.balanceNeedsConfirmation){
        var typed = parseFloat(balInput.value);
        if (isNaN(typed)){
          pendingParsed = parsed;
          balRow.style.display = 'block';
          balLabel.textContent = info.type === 'ameris'
            ? 'Current balance (Ameris exports have no balance column - type it in)'
            : 'This account has pending transactions - BoA’s own ending balance ($' + parsed.balance.toFixed(2) + ') may not match reality. Type the confirmed current balance:';
          showError('Enter the confirmed balance above, then click "Add this account" again.');
          return;
        }
        mergeAccountData(info.value, parsed.transactions, { account: info.value, balance: typed, source: 'manual-confirmed' });
      } else {
        mergeAccountData(info.value, parsed.transactions, { account: info.value, balance: parsed.balance, source: 'file' });
      }
    }

    if (pendingParsed){ finish(pendingParsed); return; }

    try {
      var parser = info.type === 'boa' ? parseBoAFile : info.type === 'delta' ? parseDeltaFile : parseAmerisFile;
      finish(parser(currentText, info.value));
    } catch (e){
      showError('Could not parse this file: ' + e.message);
    }
  });

  // --- "no new file this round" path - inherently manual, there's no file to sniff ---
  var noFileChk = document.getElementById('addNoFile');
  var noFileAccountRow = document.getElementById('noFileAccountRow');
  var noFileAccountSel = document.getElementById('noFileAccount');
  var noFileBalanceRow = document.getElementById('noFileBalanceRow');
  var noFileBalanceInput = document.getElementById('noFileBalanceInput');
  var btnNoFileAdd = document.getElementById('btnNoFileAdd');
  noFileChk.addEventListener('change', function(){
    var show = noFileChk.checked ? 'block' : 'none';
    noFileAccountRow.style.display = show; noFileBalanceRow.style.display = show; btnNoFileAdd.style.display = show;
  });
  btnNoFileAdd.addEventListener('click', function(){
    clearError();
    var acct = noFileAccountSel.value;
    var bal = parseFloat(noFileBalanceInput.value);
    if (!acct){ showError('Choose which account this balance is for.'); return; }
    if (isNaN(bal)){ showError('Enter the balance to carry forward.'); return; }
    mergeAccountData(acct, [], { account: acct, balance: bal, source: 'carry-forward' });
  });
}

document.getElementById('btnReset').addEventListener('click', function(){
  if (!confirm('Start over? This clears the current pull (locally and in Firebase) once Claude has already used it - only do this after the handoff is built.')) return;
  STATE.pull = null; saveLocal(); render(); if (typeof FB!=='undefined') FB.scheduleWrite();
});

// ---------------- local persistence ----------------
function saveLocal(){ try { localStorage.setItem('budget-ingest-v1', JSON.stringify(STATE)); } catch(e){} }
function loadLocal(){ try { var raw = localStorage.getItem('budget-ingest-v1'); if (raw) STATE = JSON.parse(raw); } catch(e){} }

// ============================================================================
// FIREBASE SYNC MODULE - structural copy of the pattern used by every other
// app in this family (ignite-trip-app, missionbudget01). Reuses the
// existing mcdonald-budget-01 project under a new budget/ingest path -
// no new Firebase project, no new rules deploy (budget/ is already open).
// Rules carried forward, do not strip when touching this: the _fbArr()
// array normalizer, the savedAt echo guard, the 300ms write debounce, and
// the SCHEMA_VERSION stale-block guard.
// ============================================================================
var _staleBlocked = false;
function hardReload(){ location.href = location.pathname + '?v=' + Date.now(); }
function showStaleBlock(){
  if (_staleBlocked) return; _staleBlocked = true;
  var o = document.createElement('div'); o.id='staleBlock';
  o.innerHTML = '<div class="stale-block-card">This app is out of date - someone else has already saved a newer version. Reload to keep working safely (nothing already saved will be lost).<br><button onclick="hardReload()">Reload</button></div>';
  document.body.appendChild(o);
}
var FB = (function(){
  var _config = {
    apiKey:            "AIzaSyBT_eGObW-c9tBTpLqPovvSoN-Ieo-jGe8",
    authDomain:        "mcdonald-budget-01.firebaseapp.com",
    projectId:         "mcdonald-budget-01",
    storageBucket:     "mcdonald-budget-01.firebasestorage.app",
    messagingSenderId: "472291576800",
    appId:             "1:472291576800:web:722f5e004b5e2ef5b83985",
    databaseURL:       "https://mcdonald-budget-01-default-rtdb.firebaseio.com"
  };
  var _db=null, _ref=null, _writeTimer=null, _lastSavedAt=null, _initialized=false, _listenerOn=false;
  function _setStatus(state,label){ var b=document.getElementById('syncBadge'), l=document.getElementById('syncLabel'); if(b) b.setAttribute('data-state',state); if(l) l.textContent=label||state; }
  function _fbArr(val){
    if(!val) return [];
    if(Array.isArray(val)) return val;
    if(typeof val==='object'){ var keys=Object.keys(val); if(keys.length>0 && keys.every(function(k){return /^\d+$/.test(k);})) return keys.sort(function(a,b){return +a-+b;}).map(function(k){return val[k];}); }
    return [];
  }
  function _normalize(data){
    if (!data || !data.pull) return { pull: null };
    var p = data.pull;
    return { pull: { pullDate:p.pullDate, status:p.status, transactions:_fbArr(p.transactions), balances:_fbArr(p.balances), filesAdded:_fbArr(p.filesAdded) } };
  }
  function _buildPayload(){ return { kind:'budget-ingest', version:SCHEMA_VERSION, savedAt:new Date().toISOString(), pull: STATE.pull }; }
  function _applyPayload(result){ if(!result) return; STATE = _normalize(result); saveLocal(); render(); }
  function _doWrite(){
    if(!_ref || _staleBlocked) return;
    _setStatus('syncing','syncing...');
    var payload = _buildPayload(); _lastSavedAt = payload.savedAt;
    _ref.set(payload).then(function(){ _setStatus('synced','synced'); }).catch(function(){ _setStatus('offline','offline'); });
  }
  function scheduleWrite(){ if(!_initialized) return; clearTimeout(_writeTimer); _writeTimer=setTimeout(_doWrite,300); }
  function init(){
    try{
      if (typeof firebase==='undefined' || !firebase.app){ _setStatus('offline','offline'); return; }
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(_config);
      _db = firebase.database(app);
      _ref = _db.ref('budget/ingest/current');
      _initialized = true; _setStatus('syncing','loading...');
      _ref.once('value').then(function(snap){
        var data = snap.val();
        if (data && data.savedAt){
          _lastSavedAt = data.savedAt;
          if (typeof data.version==='number' && data.version>SCHEMA_VERSION){ showStaleBlock(); _setStatus('offline','out of date'); }
          else { _applyPayload(data); _setStatus('synced','synced'); }
        } else if (STATE.pull) { _doWrite(); }
        else { _setStatus('synced','synced'); }
        if (!_listenerOn){
          _listenerOn = true;
          _ref.on('value', function(snap2){
            var remote = snap2.val();
            if (!remote || !remote.savedAt) return;
            if (_lastSavedAt && remote.savedAt <= _lastSavedAt) return;
            _lastSavedAt = remote.savedAt;
            if (typeof remote.version==='number' && remote.version>SCHEMA_VERSION){ showStaleBlock(); _setStatus('offline','out of date'); return; }
            _setStatus('syncing','syncing...'); _applyPayload(remote); _setStatus('synced','synced');
          });
        }
      }).catch(function(){ _setStatus('offline','offline'); });
    } catch(e){ _setStatus('offline','offline'); }
  }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else setTimeout(init,100);
  return { scheduleWrite: scheduleWrite };
})();

// ---------------- update-check banner (same pattern as the dashboard/ignite apps) ----------------
(function(){
  var CHECK_INTERVAL_MS = 5*60*1000; var _knownTag = null;
  function check(){
    fetch(location.pathname, {method:'HEAD', cache:'no-store'}).then(function(r){
      var tag = r.headers.get('etag') || r.headers.get('last-modified');
      if (!tag) return;
      if (_knownTag && tag!==_knownTag) showBanner();
      _knownTag = tag;
    }).catch(function(){});
  }
  function showBanner(){
    if (document.getElementById('updateBanner')) return;
    var b = document.createElement('div'); b.id='updateBanner'; b.className='update-banner';
    b.textContent = 'A new version is available — tap to reload'; b.onclick = hardReload;
    document.body.appendChild(b);
  }
  check(); setInterval(check, CHECK_INTERVAL_MS);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='visible') check(); });
  window.addEventListener('pageshow', check);
})();

loadLocal();
render();
